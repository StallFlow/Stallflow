name: Publish the app

# Builds one site per stall (scripts/build-site.sh) and publishes it to
# GitHub Pages. Runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the scripts parse
        run: |
          for f in web/core/*.js web/plugins/*.js web/app/sw.js; do node --check "$f"; done
          for f in server/*.gs stalls/*/*.gs; do cp "$f" /tmp/check.js; node --check /tmp/check.js; done
      - name: Server tests
        run: node tests/server.test.js
      - name: Build
        run: scripts/build-site.sh "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
