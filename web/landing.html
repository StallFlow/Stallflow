<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StallFlow</title>
<meta name="theme-color" content="#7B2D43">
<style>
  :root { --brand: #7B2D43; --ink: #221A1C; --paper: #FCF8F4; --muted: #6E6164; }
  @media (prefers-color-scheme: dark) {
    :root { --brand: #D98AA0; --ink: #F1E8EA; --paper: #171213; --muted: #A8979B; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 20px; }
  h1 { color: var(--brand); font-size: 34px; margin: 0 0 8px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>StallFlow</h1>
  <p>Pre-orders, a till that works without signal, stock and the numbers for market stalls.</p>
  <p class="muted">Each stall has its own link. If you are looking for a stall's order page, ask the stall for it.</p>
  <p class="muted"><a href="privacy.html" style="color:inherit">Privacy policy</a></p>
</main>
</body>
</html>
